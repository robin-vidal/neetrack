services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neetrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: neetrack
    volumes:
      - neetrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neetrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/robin-vidal/neetrack:${IMAGE_TAG}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://neetrack:${POSTGRES_PASSWORD}@db:5432/neetrack?sslmode=disable
      LISTEN_ADDR: ":8080"
      COOKIE_SECURE: "true"
      LOG_LEVEL: "INFO"

  backup:
    profiles: ["backup"]
    build: ./backup
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backup.env
        required: false
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: neetrack
      PGDATABASE: neetrack
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      TZ: UTC
    volumes:
      - ./backups:/backups
    restart: unless-stopped

  restore-db:
    profiles: ["restore-check"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neetrack
      POSTGRES_PASSWORD: restore-check
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neetrack"]
      interval: 2s
      timeout: 2s
      retries: 30

  caddy:
    image: caddy:alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      NEETRACK_DOMAIN: ${NEETRACK_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  neetrack-db:
  caddy-data:
  caddy-config:
