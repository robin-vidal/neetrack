name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # Pinned: "latest" resolves to v2, whose config schema is incompatible
      # with the v1-style .golangci.yml this repo uses.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v1.64.8

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Check internal/scheduler coverage
        run: |
          go test ./internal/scheduler/... -coverprofile=coverage.out
          coverage=$(go tool cover -func=coverage.out | grep ^total: | awk '{print substr($3, 1, length($3)-1)}')
          echo "internal/scheduler coverage: ${coverage}%"
          awk -v cov="$coverage" 'BEGIN { exit !(cov >= 85) }' || {
            echo "::error::internal/scheduler coverage ${coverage}% is below the required 85%"
            exit 1
          }

      - name: Verify Docker build
        run: docker build -t neetrack:ci .
