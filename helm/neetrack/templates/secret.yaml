{{- if not .Values.existingSecret }}
{{- if not .Values.databaseUrl }}
{{- fail "Either databaseUrl or existingSecret must be set." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neetrack.fullname" . }}
  labels:
    {{- include "neetrack.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.databaseUrl | quote }}
{{- end }}
